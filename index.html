<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álvaro Rubio - Personal Website</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav id="main-nav">
      <div class="nav-brand">Álvaro Rubio</div>
      <!-- TODO: Add mobile hamburger menu for responsive navigation -->
      <ul class="nav-links">
        <li><a href="#about">About</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="hero">
      <h1>Hi, I'm Álvaro Rubio</h1>
      <p>Welcome to my personal website.</p>
    </section>

    <section id="about">
      <h2>About Me</h2>
      <p>I'm a developer passionate about building things for the web.</p>
    </section>

    <section id="projects">
      <h2>Projects</h2>
      <!-- TODO: Add project cards with image, title, description, and link -->
      <p>Projects coming soon.</p>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <form id="contact-form" action="#" method="POST">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit">Send</button>
      </form>
      <!-- TODO: Add client-side form validation with error messages -->
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Álvaro Rubio</p>
    <!-- TODO: Add social media icon links (GitHub, LinkedIn, etc.) -->
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
